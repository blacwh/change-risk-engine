name: Self analysis

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  analyze-pull-request:
    if: github.event_name == 'pull_request'
    name: Analyze pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out analyzed head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Analyze change
        id: change-risk
        uses: ./
        env:
          GITHUB_TOKEN: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.token || '' }}
        with:
          comment: 'true'
          fail-on: none
          output: change-risk-report.json
      - name: Upload JSON report
        uses: actions/upload-artifact@v7
        with:
          name: change-risk-report
          path: change-risk-report.json
          if-no-files-found: error
          retention-days: 14

  analyze-push:
    if: github.event_name == 'push'
    name: Analyze master push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out analyzed head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Analyze change
        uses: ./
        with:
          comment: 'false'
          fail-on: none
          output: change-risk-report.json
      - name: Upload JSON report
        uses: actions/upload-artifact@v7
        with:
          name: change-risk-report
          path: change-risk-report.json
          if-no-files-found: error
          retention-days: 14
